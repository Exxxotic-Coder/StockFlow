<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80">
  <defs>
    <linearGradient id="stockflowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155EEF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <g transform="translate(110, 0)">
    <!-- Sleek Rounded Rect Icon -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#stockflowGradient)"/>
    <!-- Flowing Upward Trend Line inside the icon -->
    <path d="M18 55 Q 32 30, 42 42 T 62 22" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 22 L62 22 L62 34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Title Text -->
    <text x="100" y="56" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#0F172A" letter-spacing="-1.5">Stock<tspan fill="#14B8A6">Flow</tspan></text>
